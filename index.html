<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Journey Portfolio</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #050816;
      color: white;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #915EFF;
      border-radius: 20px;
    }

    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 4px;
      background: linear-gradient(to right, #00C2FF, #915EFF);
      z-index: 9999;
    }

    section {
      min-height: 100vh;
      padding: 80px 8%;
      position: relative;
    }

    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      background:
        radial-gradient(circle at top left, rgba(145,94,255,0.25), transparent 30%),
        radial-gradient(circle at bottom right, rgba(0,194,255,0.15), transparent 30%),
        #050816;
    }

    .hero h1 {
      font-size: 6rem;
      font-family: 'Space Grotesk', sans-serif;
      line-height: 1;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: #915EFF;
    }

    .hero p {
      font-size: 1.4rem;
      max-width: 700px;
      color: #cfcfcf;
      line-height: 1.8;
    }

    .scroll-down {
      margin-top: 50px;
      color: #00C2FF;
      letter-spacing: 4px;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(10px); }
    }

    .section-title {
      font-size: 3rem;
      margin-bottom: 80px;
      font-family: 'Space Grotesk', sans-serif;
    }

    .timeline {
      position: relative;
      margin-left: 30px;
      border-left: 2px solid rgba(255,255,255,0.15);
    }

    .timeline-card {
      position: relative;
      margin-bottom: 80px;
      padding-left: 40px;
      opacity: 0;
      transform: translateY(100px);
    }

    .timeline-card::before {
      content: '';
      position: absolute;
      left: -10px;
      top: 10px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #915EFF;
      box-shadow: 0 0 20px #915EFF;
    }

    .timeline-year {
      color: #00C2FF;
      font-size: 0.9rem;
      margin-bottom: 10px;
      letter-spacing: 3px;
    }

    .timeline-title {
      font-size: 2rem;
      margin-bottom: 15px;
      font-family: 'Space Grotesk', sans-serif;
    }

    .timeline-description {
      color: #cfcfcf;
      line-height: 1.8;
      max-width: 700px;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
    }

    .skill-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 30px;
      transition: 0.3s;
      backdrop-filter: blur(10px);
    }

    .skill-card:hover {
      transform: translateY(-10px);
      border-color: #915EFF;
      box-shadow: 0 0 40px rgba(145,94,255,0.3);
    }

    .skill-card h3 {
      margin-bottom: 10px;
      font-size: 1.3rem;
    }

    .skill-card p {
      color: #bcbcbc;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
    }

    .project-card {
      background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
      padding: 35px;
      border-radius: 25px;
      transition: 0.4s;
      border: 1px solid rgba(255,255,255,0.06);
      position: relative;
      overflow: hidden;
    }

    .project-card::before {
      content: '';
      position: absolute;
      width: 200px;
      height: 200px;
      background: rgba(145,94,255,0.15);
      border-radius: 50%;
      top: -80px;
      right: -80px;
    }

    .project-card:hover {
      transform: translateY(-10px);
      border-color: #00C2FF;
    }

    .project-card h3 {
      font-size: 1.7rem;
      margin-bottom: 15px;
    }

    .project-card p {
      color: #cfcfcf;
      line-height: 1.7;
    }

    .tech-stack {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .tech-stack span {
      background: rgba(145,94,255,0.15);
      color: #d8c8ff;
      padding: 8px 14px;
      border-radius: 100px;
      font-size: 0.9rem;
    }

    .terminal {
      background: #0d1117;
      border-radius: 20px;
      padding: 40px;
      border: 1px solid rgba(255,255,255,0.08);
      font-family: monospace;
      line-height: 2;
      font-size: 1.1rem;
    }

    .terminal .green {
      color: #00ff88;
    }

    .terminal .blue {
      color: #00C2FF;
    }

    .ending {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: black;
    }

    .ending h2 {
      font-size: 4rem;
      max-width: 900px;
      line-height: 1.4;
      font-family: 'Space Grotesk', sans-serif;
    }

    .ending h2 span {
      color: #915EFF;
    }

    .floating-glow {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(145,94,255,0.2), transparent 70%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: -1;
    }

    @media(max-width: 768px) {

      .hero h1 {
        font-size: 3.5rem;
      }

      .hero p {
        font-size: 1rem;
      }

      .section-title {
        font-size: 2rem;
      }

      .timeline-title {
        font-size: 1.4rem;
      }

      .ending h2 {
        font-size: 2rem;
      }

    }

  </style>
</head>
<body>

  <div id="progress-bar"></div>
  <div class="floating-glow"></div>

  <section class="hero" id="hero"></section>

  <section>
    <h2 class="section-title">My Journey</h2>
    <div class="timeline" id="timeline"></div>
  </section>

  <section>
    <h2 class="section-title">Skills Evolution</h2>
    <div class="skills-grid" id="skills"></div>
  </section>

  <section>
    <h2 class="section-title">Projects</h2>
    <div class="projects" id="projects"></div>
  </section>

  <section>
    <h2 class="section-title">Terminal</h2>
    <div class="terminal" id="terminal"></div>
  </section>

  <section class="ending">
    <h2>
      From <span>confusion</span><br>
      to <span>confidence</span>.<br><br>
      And this is only the beginning.
    </h2>
  </section>

  <script>

    const portfolioData = {

      hero: {
        name: 'Mehul Joshi',
        title: 'Full Stack Developer',
        tagline: 'From struggling student to building enterprise applications used by real businesses.'
      },

      journey: [
        {
          year: '2012',
          title: 'The Confused Student',
          description: 'Academics were difficult for me. I had no clarity about my future and no confidence in myself.'
        },
        {
          year: '2015',
          title: 'First Time Seeing Code',
          description: 'Programming looked impossible initially. But curiosity slowly became obsession.'
        },
        {
          year: '2018',
          title: 'Started Building Projects',
          description: 'I began creating real-world applications and understood the power of solving problems through software.'
        },
        {
          year: '2021',
          title: 'Professional Developer',
          description: 'Built scalable ERP systems, desktop applications, invoice automation, and enterprise solutions.'
        },
        {
          year: '2026',
          title: 'Still Growing',
          description: 'Now focused on architecture, performance optimization, clean systems, and advanced user experiences.'
        }
      ],

      skills: [
        {
          name: 'Frontend',
          description: 'Angular, React.js, jQuery, HTML5, CSS3'
        },
        {
          name: 'Backend',
          description: 'Node.js, Express.js, REST APIs'
        },
        {
          name: 'Database',
          description: 'MongoDB, MySQL'
        },
        {
          name: 'Desktop Apps',
          description: 'Electron.js cross-platform applications'
        },
        {
          name: 'Architecture',
          description: 'Performance optimization and scalable systems'
        },
        {
          name: 'UI/UX',
          description: 'Animated interfaces and modern experiences'
        }
      ],

      projects: [
        {
          title: 'ERP System',
          description: 'Enterprise-grade management software handling inventory, accounting, invoicing, barcode systems, and reporting.',
          stack: ['Angular', 'Node.js', 'MongoDB']
        },
        {
          title: 'Desktop Automation App',
          description: 'Electron-based desktop software with offline printing, PDF generation, email automation, and hardware integration.',
          stack: ['Electron', 'Node.js', 'SQLite']
        },
        {
          title: 'Invoice Engine',
          description: 'Dynamic invoice generation system with GST calculations, PDF exports, thermal printing, and mail integration.',
          stack: ['Node.js', 'HTML', 'jQuery']
        }
      ]

    };

    function renderHero() {

      $('#hero').html(`
        <h1>
          ${portfolioData.hero.name.split(' ')[0]}
          <span>${portfolioData.hero.name.split(' ')[1]}</span>
        </h1>

        <p>
          ${portfolioData.hero.tagline}
        </p>

        <div class="scroll-down">
          SCROLL TO EXPLORE
        </div>
      `);
    }

    function renderJourney() {

      portfolioData.journey.forEach(item => {

        $('#timeline').append(`
          <div class="timeline-card">

            <div class="timeline-year">
              ${item.year}
            </div>

            <div class="timeline-title">
              ${item.title}
            </div>

            <div class="timeline-description">
              ${item.description}
            </div>

          </div>
        `);

      });
    }

    function renderSkills() {

      portfolioData.skills.forEach(skill => {

        $('#skills').append(`
          <div class="skill-card">
            <h3>${skill.name}</h3>
            <p>${skill.description}</p>
          </div>
        `);

      });
    }

    function renderProjects() {

      portfolioData.projects.forEach(project => {

        const stack = project.stack.map(item => `<span>${item}</span>`).join('');

        $('#projects').append(`
          <div class="project-card">

            <h3>${project.title}</h3>

            <p>
              ${project.description}
            </p>

            <div class="tech-stack">
              ${stack}
            </div>

          </div>
        `);

      });
    }

    function renderTerminal() {

      $('#terminal').html(`
        <div><span class="green">></span> whoami</div>
        <div class="blue">Mehul Joshi</div>
        <br>

        <div><span class="green">></span> experience</div>
        <div class="blue">9+ Years</div>
        <br>

        <div><span class="green">></span> specialty</div>
        <div class="blue">Full Stack Development & Enterprise Applications</div>
        <br>

        <div><span class="green">></span> status</div>
        <div class="blue">Still learning. Still building.</div>
      `);
    }

    function initializeAnimations() {

      gsap.registerPlugin(ScrollTrigger);

      gsap.from('.hero h1', {
        opacity: 0,
        y: 100,
        duration: 1.2
      });

      gsap.from('.hero p', {
        opacity: 0,
        y: 50,
        duration: 1,
        delay: 0.5
      });

      gsap.utils.toArray('.timeline-card').forEach(card => {

        gsap.to(card, {
          opacity: 1,
          y: 0,
          duration: 1,
          scrollTrigger: {
            trigger: card,
            start: 'top 80%'
          }
        });

      });

      gsap.from('.skill-card', {
        opacity: 0,
        y: 50,
        stagger: 0.2,
        duration: 1,
        scrollTrigger: {
          trigger: '#skills',
          start: 'top 70%'
        }
      });

      gsap.from('.project-card', {
        opacity: 0,
        y: 80,
        stagger: 0.3,
        duration: 1,
        scrollTrigger: {
          trigger: '#projects',
          start: 'top 70%'
        }
      });
    }

    function initializeProgressBar() {

      window.addEventListener('scroll', () => {

        const scrollTop = document.documentElement.scrollTop;
        const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;

        const progress = (scrollTop / scrollHeight) * 100;

        $('#progress-bar').css('width', progress + '%');
      });
    }

    function initializeGlowEffect() {

      $(document).mousemove(function(e) {

        $('.floating-glow').css({
          left: e.clientX + 'px',
          top: e.clientY + 'px'
        });

      });
    }

    $(document).ready(function() {

      renderHero();
      renderJourney();
      renderSkills();
      renderProjects();
      renderTerminal();

      initializeAnimations();
      initializeProgressBar();
      initializeGlowEffect();

    });

  </script>

</body>
</html>
